# Copy to config/connections.toml (local, ignored by Git).
# active selects the startup connection. Ctrl+K switches connections for this session.
# Use + Nueva conexión in the TUI to store full URLs in the OS keychain.
# The TUI writes secret_ref identifiers here, never credentials.
active = "demo"

[connections.demo]
demo = true

# Store real DSNs in environment variables or the root .env, never here.
[connections.desarrollo]
dsn_env = "DEV_DATABASE_URL"

[connections.produccion]
dsn_env = "PROD_DATABASE_URL"
